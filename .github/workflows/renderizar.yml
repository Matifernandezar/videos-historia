# Renderiza en la nube de GitHub los videos marcados para entrega y deja el MP4 en Releases.
# - Se dispara solo cuando un push trae un producciones/<video>/entrega.json nuevo o cambiado.
# - También a mano: pestaña Actions → "Renderizar y entregar" → Run workflow
#   (video vacío = todos los marcados; "prueba" = render de prueba de 3 s).
# No publica nada en redes: el release queda en este repositorio privado.
name: Renderizar y entregar

on:
  push:
    paths:
      - "producciones/*/entrega.json"
  workflow_dispatch:
    inputs:
      video:
        description: "Carpeta del video (vacío = todos los marcados para entrega; 'prueba' = render de prueba de 3 s)"
        required: false
        default: ""
      rehacer:
        description: "Volver a renderizar aunque ya esté entregado"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: entregas
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Caché de npm y del navegador de Remotion
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules/.remotion
          key: remotion-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: Librerías de Linux para el navegador
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 \
            libpango-1.0-0 libatk-bridge2.0-0 || echo "::warning::No se pudieron instalar algunas librerías (suelen venir ya instaladas)"

      - name: Dependencias
        run: npm install --no-audit --no-fund

      - name: Navegador de Remotion
        run: npx remotion browser ensure

      - name: Renderizar y subir a Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO: ${{ inputs.video }}
          REHACER: ${{ inputs.rehacer }}
        run: node scripts/ci/entregar-en-actions.mjs

      - name: Guardar registros si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-y-registros
          path: |
            producciones/*/qa/
            logs/
          if-no-files-found: ignore
          retention-days: 7
